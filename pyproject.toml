[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[tool.pytest.ini_options]
pythonpath=["."]
[project]
name="wasmfence"
description="Offline deterministic WebAssembly capability-manifest gate"
version="1.0.0"
requires-python=">=3.10"
[tool.setuptools]
py-modules=["wasmfence"]
[project.scripts]
wasmfence="wasmfence:main"
