name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest ruff
      - run: pytest -q
      - run: ruff check wasmfence.py tests
      - run: python -m compileall -q wasmfence.py
      - name: CLI and SARIF smoke tests
        shell: bash
        run: |
          set +e
          wasmfence --format json --policy fixtures/policy.json fixtures/module.wat > report.json
          json_code=$?
          wasmfence --format sarif --policy fixtures/policy.json fixtures/manifest.json > report.sarif
          sarif_code=$?
          set -e
          test "$json_code" -eq 1
          test "$sarif_code" -eq 1
          grep -q '"schema_version": 2' report.json
          grep -q '"version": "2.1.0"' report.sarif
